<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrono Running Flipper Jumper</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#071225;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#app{
  max-width:1000px;
  height:100vh;
  margin:auto;
  background:linear-gradient(#0b3b78,#140b36);
  overflow:auto;
}
header{
  height:60px;
  background:#06172f;
  display:flex;
  align-items:center;
  justify-content:space-around;
  font-weight:bold;
}
.title{color:#ffd83d;font-size:21px}
#screen{padding:15px}
.hero{
  text-align:center;
  background:#15345e;
  border:2px solid #35d9ff;
  border-radius:18px;
  padding:25px 10px;
}
.hero h1{color:#ffd83d;font-size:38px;margin:5px}
.hero h2{color:#35d9ff;margin:5px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}
button{
  background:#183d6d;
  color:white;
  border:2px solid #35d9ff;
  border-radius:14px;
  padding:18px 8px;
  font-size:18px;
  font-weight:bold;
}
button:active{transform:scale(.95)}
.card{
  background:#15345e;
  border:2px solid #35d9ff;
  border-radius:16px;
  padding:18px;
  margin-top:15px;
}
.hide{display:none!important}

/* RUNNER */
#arena{
  height:390px;
  position:relative;
  overflow:hidden;
  border:3px solid white;
  border-radius:16px;
  background:linear-gradient(#2686cf 0 60%,#65bd50 60%);
}
#ground{
  position:absolute;
  bottom:0;
  height:110px;
  width:100%;
  background:repeating-linear-gradient(
    90deg,#315d31 0 55px,#46783a 55px 110px
  );
}
#runner{
  position:absolute;
  left:80px;
  bottom:110px;
  font-size:48px;
}
.obstacle{
  position:absolute;
  bottom:110px;
  width:40px;
  height:60px;
  background:#ed4545;
  border-radius:8px;
}
.coin{
  position:absolute;
  bottom:200px;
  font-size:28px;
}
#message{
  text-align:center;
  font-size:20px;
  margin:10px;
}

/* MOBILE */
@media(max-width:600px){
  .hero h1{font-size:30px}
  .grid{grid-template-columns:1fr 1fr}
  button{font-size:16px;padding:15px 5px}
}
</style>
</head>

<body>

<div id="app">

<header>
  <span class="title">⏱️ CHRONO</span>
  <span>🪙 <b id="coins">250</b></span>
  <span>💎 <b id="gems">20</b></span>
</header>

<div id="screen">

<!-- HOME -->
<section id="home">

<div class="hero">
<h1>CHRONO RUNNING</h1>
<h2>FLIPPER JUMPER</h2>
<p>🏃 Run • ⚡ Flipper • 🍕 Pizza • 🏺 Egypt</p>
<p>🏗️ Tycoon • 🐶 Dog Maze • 💰 Clicker</p>
</div>

<div class="grid">

<button onclick="startRunner()">
🏃 RUNNER
</button>

<button onclick="flipper()">
⚡ FLIPPER
</button>

<button onclick="pizza()">
🍕 PIZZA PUZZLE
</button>

<button onclick="egypt()">
🏺 EGYPT EVENT
</button>

<button onclick="tycoon()">
🏗️ TYCOON
</button>

<button onclick="dogMaze()">
🐶 DOG MAZE
</button>

</div>

<div class="card">
<h2>🌟 Collaboration Program</h2>
<p>Complete events and earn special rewards!</p>
<button onclick="collab()">🤝 COLLAB REWARD</button>
</div>

</section>


<!-- RUNNER -->
<section id="runnerGame" class="hide">

<div id="message">
Score: 0
</div>

<div id="arena">

<div id="runner">
🏃
</div>

<div id="ground"></div>

</div>

<div class="grid">

<button onclick="jump()">
⬆️ JUMP
</button>

<button onclick="left()">
◀️ LEFT
</button>

<button onclick="right()">
RIGHT ▶️
</button>

<button onclick="home()">
🏠 HOME
</button>

</div>

</section>

</div>
</div>


<script>

let coins=250;
let gems=20;

let running=false;
let jumping=false;

let score=0;
let playerX=80;

const coinsText=document.getElementById("coins");
const gemsText=document.getElementById("gems");

const homeScreen=document.getElementById("home");
const runnerScreen=document.getElementById("runnerGame");

const player=document.getElementById("runner");
const arena=document.getElementById("arena");
const message=document.getElementById("message");

// initialize UI money display
updateMoney();

function updateMoney(){
  coinsText.textContent=Math.floor(coins);
  gemsText.textContent=Math.floor(gems);
}

function home(){
  running=false;

  homeScreen.classList.remove("hide");
  runnerScreen.classList.add("hide");

  // remove any active obstacles/coins
  document.querySelectorAll(".obstacle,.coin").forEach(
    x=>x.remove()
  );
}

function startRunner(){
  homeScreen.classList.add("hide");
  runnerScreen.classList.remove("hide");

  running=true;
  jumping=false;
  score=0;
  playerX=80;

  player.style.left=playerX+"px";
  player.style.bottom="110px";

  message.textContent="Score: 0";

  // start spawns and loop
  spawnObstacle();
  // start occasional coin spawns as well
  spawnCoin();
  runnerLoop();
}

function runnerLoop(){
  if(!running) return;

  score++;

  message.textContent =
    "🏃 Score: "+score+"   🪙 "+Math.floor(coins);

  // occasionally spawn coins in addition to the spawnCoin's own scheduling
  if(Math.random() < 0.03){
    spawnCoin();
  }

  setTimeout(runnerLoop,100);
}

function spawnObstacle(){
  if(!running) return;

  let obstacle=document.createElement("div");
  obstacle.className="obstacle";
  obstacle.style.left="100%";
  arena.appendChild(obstacle);

  let x=100;

  let timer=setInterval(()=>{

    if(!running){
      clearInterval(timer);
      obstacle.remove();
      return;
    }

    x-=1.2;
    obstacle.style.left=x+"%";

    let obstaclePixel = arena.clientWidth * x / 100;
    let playerRight = playerX + 45;

    if(
      obstaclePixel < playerRight &&
      obstaclePixel > playerX - 20 &&
      !jumping
    ){
      running=false;

      alert(
        "💥 BONK!\n\nScore: "+score
      );

      home();

      clearInterval(timer);
      return;
    }

    if(x < -10){
      // obstacle passed off-screen, reward small coin
      coins += 2;
      updateMoney();

      clearInterval(timer);
      obstacle.remove();
      return;
    }

  },16);

  setTimeout(
    spawnObstacle,
    1500 + Math.random() * 1500
  );
}

function spawnCoin(){
  if(!running) return;

  let coin=document.createElement("div");
  coin.className="coin";
  coin.textContent="🪙";
  coin.style.left="100%";
  arena.appendChild(coin);

  let x=100;

  let timer=setInterval(()=>{

    if(!running){
      clearInterval(timer);
      coin.remove();
      return;
    }

    x -= 1.3;
    coin.style.left = x + "%";

    // convert percent to pixel position for reliable collision check
    let coinPixel = arena.clientWidth * x / 100;
    let playerRight = playerX + 45;

    // collision/pickup detection similar to obstacles
    if(coinPixel < playerRight && coinPixel > playerX - 20){
      coins += 5;
      clearInterval(timer);        // fixed spelling and case
      coin.remove();              // remove coin from DOM
      updateMoney();              // refresh UI
      return;
    }

    // cleanup if coin moves off screen
    if(x < -10){
      clearInterval(timer);
      coin.remove();
      return;
    }

  },16);

  // schedule another coin in the future (staggered)
  setTimeout(spawnCoin, 2000 + Math.random() * 2000);
}

// Minimal runner control implementations

function jump(){
  if(!running) return;
  if(jumping) return;
  jumping = true;
  let up = 0;
  // move up
  const jumpTimer = setInterval(()=>{
    up += 12;
    player.style.bottom = (110 + up) + "px";
    if(up >= 140){
      clearInterval(jumpTimer);
      // fall back down
      const fallTimer = setInterval(()=>{
        up -= 14;
        player.style.bottom = (110 + Math.max(0, up)) + "px";
        if(up <= 0){
          clearInterval(fallTimer);
          player.style.bottom = "110px";
          jumping = false;
        }
      }, 16);
    }
  }, 16);
}

function left(){
  if(!running) return;
  // move left by a chunk and clamp to 0
  playerX = Math.max(0, playerX - 40);
  player.style.left = playerX + "px";
}

function right(){
  if(!running) return;
  // limit right movement so player stays in arena
  const maxX = Math.max(0, arena.clientWidth - 60);
  playerX = Math.min(maxX, playerX + 40);
  player.style.left = playerX + "px";
}

// Stubs for other game modes / buttons.
// Implement these properly later. For now they are safe no-ops or simple alerts.

function flipper(){
  alert("Flipper mode not implemented yet.");
}

function pizza(){
  alert("Pizza puzzle mode not implemented yet.");
}

function egypt(){
  alert("Egypt event not implemented yet.");
}

function tycoon(){
  alert("Tycoon mode not implemented yet.");
}

function dogMaze(){
  alert("Dog Maze mode not implemented yet.");
}

function collab(){
  alert("Collaboration reward not implemented yet.");
}

</script>

</body>
</html>
