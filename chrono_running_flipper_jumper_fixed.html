<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrono Running Flipper Jumper</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#071225;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#app{
  max-width:1000px;
  height:100vh;
  margin:auto;
  background:linear-gradient(#0b3b78,#140b36);
  overflow:auto;
}
header{
  height:60px;
  background:#06172f;
  display:flex;
  align-items:center;
  justify-content:space-around;
  font-weight:bold;
}
.title{color:#ffd83d;font-size:21px}
#screen{padding:15px}
.hero{
  text-align:center;
  background:#15345e;
  border:2px solid #35d9ff;
  border-radius:18px;
  padding:25px 10px;
}
.hero h1{color:#ffd83d;font-size:38px;margin:5px}
.hero h2{color:#35d9ff;margin:5px}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:15px;
}
button{
  background:#183d6d;
  color:white;
  border:2px solid #35d9ff;
  border-radius:14px;
  padding:18px 8px;
  font-size:18px;
  font-weight:bold;
}
button:active{transform:scale(.95)}
.card{
  background:#15345e;
  border:2px solid #35d9ff;
  border-radius:16px;
  padding:18px;
  margin-top:15px;
}
.hide{display:none!important}

/* RUNNER */
#arena{
  height:390px;
  position:relative;
  overflow:hidden;
  border:3px solid white;
  border-radius:16px;
  background:linear-gradient(#2686cf 0 60%,#65bd50 60%);
}
#ground{
  position:absolute;
  bottom:0;
  height:110px;
  width:100%;
  background:repeating-linear-gradient(
    90deg,#315d31 0 55px,#46783a 55px 110px
  );
}
#runner{
  position:absolute;
  left:80px;
  bottom:110px;
  font-size:48px;
}
.obstacle{
  position:absolute;
  bottom:110px;
  width:40px;
  height:60px;
  background:#ed4545;
  border-radius:8px;
}
.coin{
  position:absolute;
  bottom:200px;
  font-size:28px;
}
#message{
  text-align:center;
  font-size:20px;
  margin:10px;
}

/* MOBILE */
@media(max-width:600px){
  .hero h1{font-size:30px}
  .grid{grid-template-columns:1fr 1fr}
  button{font-size:16px;padding:15px 5px}
}
</style>
</head>

<body>

<div id="app">

<header>
  <span class="title">⏱️ CHRONO</span>
  <span>🪙 <b id="coins">250</b></span>
  <span>💎 <b id="gems">20</b></span>
</header>

<div id="screen">

<!-- HOME -->
<section id="home">

<div class="hero">
<h1>CHRONO RUNNING</h1>
<h2>FLIPPER JUMPER</h2>
<p>🏃 Run • ⚡ Flipper • 🍕 Pizza • 🏺 Egypt</p>
<p>🏗️ Tycoon • 🐶 Dog Maze • 💰 Clicker</p>
</div>

<div class="grid">

<button onclick="startRunner()">
🏃 RUNNER
</button>

<button onclick="flipper()">
⚡ FLIPPER
</button>

<button onclick="pizza()">
🍕 PIZZA PUZZLE
</button>

<button onclick="egypt()">
🏺 EGYPT EVENT
</button>

<button onclick="tycoon()">
🏗️ TYCOON
</button>

<button onclick="dogMaze()">
🐶 DOG MAZE
</button>

</div>

<div class="card">
<h2>🌟 Collaboration Program</h2>
<p>Complete events and earn special rewards!</p>
<button onclick="collab()">🤝 COLLAB REWARD</button>
</div>

</section>


<!-- RUNNER -->
<section id="runnerGame" class="hide">

<div id="message">
Score: 0
</div>

<div id="arena">

<div id="runner">
🏃
</div>

<div id="ground"></div>

</div>

<div class="grid">

<button onclick="jump()">
⬆️ JUMP
</button>

<button onclick="left()">
◀️ LEFT
</button>

<button onclick="right()">
RIGHT ▶️
</button>

<button onclick="home()">
🏠 HOME
</button>

</div>

</section>

</div>
</div>


<script>

let coins=250;
let gems=20;

let running=false;
let jumping=false;

let score=0;
let playerX=80;

const coinsText=document.getElementById("coins");
const gemsText=document.getElementById("gems");

const homeScreen=document.getElementById("home");
const runnerScreen=document.getElementById("runnerGame");

const player=document.getElementById("runner");
const arena=document.getElementById("arena");
const message=document.getElementById("message");


function updateMoney(){

coinsText.textContent=Math.floor(coins);
gemsText.textContent=Math.floor(gems);

}


function home(){

running=false;

homeScreen.classList.remove("hide");
runnerScreen.classList.add("hide");

document.querySelectorAll(".obstacle,.coin").forEach(
x=>x.remove()
);

}


function startRunner(){

homeScreen.classList.add("hide");
runnerScreen.classList.remove("hide");

running=true;
jumping=false;
score=0;
playerX=80;

player.style.left=playerX+"px";
player.style.bottom="110px";

message.textContent="Score: 0";

spawnObstacle();
runnerLoop();

}


function runnerLoop(){

if(!running)return;

score++;

message.textContent=
"🏃 Score: "+score+"   🪙 "+coins;

if(Math.random()<0.03){

spawnCoin();

}

setTimeout(runnerLoop,100);

}


function spawnObstacle(){

if(!running)return;

let obstacle=document.createElement("div");

obstacle.className="obstacle";

obstacle.style.left="100%";

arena.appendChild(obstacle);

let x=100;

let timer=setInterval(()=>{

if(!running){

clearInterval(timer);
obstacle.remove();
return;

}

x-=1.2;

obstacle.style.left=x+"%";


let obstaclePixel=
arena.clientWidth*x/100;


let playerRight=
playerX+45;


if(
obstaclePixel<playerRight &&
obstaclePixel>playerX-20 &&
!jumping
){

running=false;

alert(
"💥 BONK!\n\nScore: "+score
);

home();

clearInterval(timer);

}


if(x<-10){

coins+=2;

updateMoney();

clearInterval(timer);

obstacle.remove();

}

},16);


setTimeout(
spawnObstacle,
1500+Math.random()*1500
);

}


function spawnCoin(){

if(!running)return;

let coin=document.createElement("div");

coin.className="coin";

coin.textContent="🪙";

coin.style.left="100%";

arena.appendChild(coin);

let x=100;

let timer=setInterval(()=>{

if(!running){

clearInterval(timer);
coin.remove();
return;

}

x-=1.3;

coin.style.left=x+"%";


if(x<15 && x>3){

coins+=5;
ClearInteral(timer)
updateMoney();
