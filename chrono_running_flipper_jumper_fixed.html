<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrono Running Flipper Jumper</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071225;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden}
#wrap{height:100vh;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,1100px);height:min(100vh,700px);background:#102a52;border:3px solid #42d9ff;border-radius:18px;box-shadow:0 0 40px #00aaff88}
#hint{position:fixed;bottom:8px;font-size:12px;opacity:.7}
#touch button{font-size:22px;padding:12px 22px;border:2px solid #42d9ff;border-radius:12px;background:#16365f;color:white}
</style>
</head>
<body style="touch-action:none">
<div id="touch" style="position:fixed;left:10px;right:10px;bottom:18px;display:flex;justify-content:center;gap:10px;z-index:5">
<button id="left">◀</button><button id="jump">⬆ JUMP</button><button id="right">▶</button>
</div>
<div id="wrap"><canvas id="game" width="1100" height="700"></canvas></div>
<div id="hint">Arrow keys / A-D move • Space jump • Click buttons • R restart</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
let mode='hub', coins=250, gems=20, score=0, best=0, speed=5, t=0, player={x:180,y:500,vy:0,w:38,h:52};
let obstacles=[], pickups=[], last=0, keys={}, dog={x:0,y:0}, mazeSolved=false, pizza=0, egypt=0;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')keys.space=true;if(e.key.toLowerCase()==='r')reset()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')keys.space=false});
function hold(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}))}
hold('left','arrowleft');hold('right','arrowright');
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();keys.space=true});
document.getElementById('jump').addEventListener('pointerup',e=>{e.preventDefault();keys.space=false});
c.addEventListener('click',e=>{let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*1100/r.width,my=(e.clientY-r.top)*700/r.height;click(mx,my)});

function reset(){mode='hub';obstacles=[];pickups=[];score=0;speed=5;player={x:180,y:500,vy:0,w:38,h:52}}
function btn(label,rx,ry,rw,rh,fn){x.fillStyle='#16365f';x.strokeStyle='#42d9ff';x.lineWidth=2;x.beginPath();x.rect(rx,ry,rw,rh);x.fill();x.stroke();x.fillStyle='#fff';x.font='bold 20px system-ui';x.textAlign='center';x.fillText(label,rx+rw/2,ry+rh/2+7);return ()=>{}}
function click(mx,my){
 if(mode==='hub'){
  if(my>560&&mx<280) mode='run';
  else if(my>560&&mx<540) mode='flipper';
  else if(my>560&&mx<800) mode='pizza';
  else if(my>560) mode='egypt';
  else if(my>405&&my<540&&mx>350&&mx<750) mode='tycoon';
 } else if(mode==='run'&&my<70){reset()}
 else if(mode==='flipper'&&my>560){flipperBall()}
 else if(mode==='pizza'&&my>500){pizza=(pizza+1)%8;if(pizza===0){coins+=100;score+=500}}
 else if(mode==='egypt'&&my>560){egypt++;if(egypt>=5){coins+=500;gems+=10;egypt=0}}
 else if(mode==='tycoon'&&my>500){coins+=Math.floor(10+gems/5)}
}
function text(s,px,py,size=20,color='#fff',align='left'){x.fillStyle=color;x.font=`bold ${size}px system-ui`;x.textAlign=align;x.fillText(s,px,py)}
function bg(){x.clearRect(0,0,1100,700);let g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,'#0a2c68');g.addColorStop(1,'#170d3b');x.fillStyle=g;x.fillRect(0,0,1100,700)}
function top(title){text(title,35,42,30,'#ffd84a');text(`🪙 ${Math.floor(coins)}`,850,35,20);text(`💎 ${gems}`,990,35,20);}

function hub(){
 bg();text('CHRONO',550,90,64,'#ffd21f','center');text('RUNNING FLIPPER JUMPER',550,145,40,'#42e6ff','center');
 text('3D-STYLE SIMULATION • TYCOON • CLICKER • MINIGAMES',550,180,17,'#fff','center');
 // hero track
 x.fillStyle='#304b76';x.fillRect(70,220,960,170);x.fillStyle='#20385c';x.fillRect(70,330,960,60);
 for(let i=0;i<12;i++){x.fillStyle=i%2?'#fff':'#ff3b30';x.fillRect(90+i*78,315,40,15)}
 x.fillStyle='#27e06f';x.beginPath();x.arc(230,295,25,0,7);x.fill();text('🏃',230,310,45,'#fff','center');
 text('RUN',145,440,26);text('FLIPPER',400,440,26);text('PIZZA',650,440,26);text('EGYPT',900,440,26);
 btn('▶ RUNNER',45,565,220,80);btn('⚡ FLIPPER',285,565,220,80);btn('🍕 PIZZA',525,565,220,80);btn('🏺 EGYPT',765,565,290,80);
 text('Tycoon building: click the center track to earn coins',550,535,15,'#b9d7ff','center');
}
function run(){
 bg();top('🏃 CHRONO RUN');text('SPACE = JUMP',550,35,14,'#b9d7ff','center');
 x.fillStyle='#1f3557';x.fillRect(0,560,1100,140);for(let i=0;i<18;i++){x.fillStyle=i%2?'#f7c948':'#4be36a';x.fillRect((i*80-(t*speed)%80),545,45,15)}
 if(Math.random()<.025) obstacles.push({x:1150,y:520,w:35+Math.random()*30,h:40+Math.random()*55});
 if(Math.random()<.035) pickups.push({x:1150,y:430+Math.random()*80,r:12});
 player.vy+=.65;player.y+=player.vy;
 if((keys.space||keys.w||keys.arrowup)&&player.y>=508)player.vy=-13;
 if(keys.arrowleft||keys.a)player.x-=6;if(keys.arrowright||keys.d)player.x+=6;player.x=Math.max(40,Math.min(500,player.x));
 obstacles.forEach(o=>o.x-=speed);pickups.forEach(p=>p.x-=speed);
 for(const o of obstacles){if(player.x<o.x+o.w&&player.x+player.w>o.x&&player.y+player.h>o.y){mode='gameover'}}
 for(let i=pickups.length-1;i>=0;i--){let p=pickups[i];if(Math.hypot(player.x+20-p.x,player.y+25-p.y)<35){coins+=5;score+=25;pickups.splice(i,1)}}
 obstacles=obstacles.filter(o=>o.x>-80);pickups=pickups.filter(p=>p.x>-30);score+=1;best=Math.max(best,score);speed=Math.min(11,5+score/1500);
 x.fillStyle='#35d36b';x.fillRect(player.x,player.y,player.w,player.h);text('👟',player.x+19,player.y+39,35,'#fff','center');
 obstacles.forEach(o=>{x.fillStyle='#f04444';x.fillRect(o.x,o.y,o.w,o.h)});pickups.forEach(p=>{text('🪙',p.x,p.y+9,24,'#ffd84a','center')});
 text(`SCORE ${score}`,30,95,22);text(`BEST ${best}`,30,125,18,'#b9d7ff');btn('🏠 HUB',930,15,140,45)
}
function flipper(){
 bg();top('⚡ FLIPPER ARENA');text('Click the ball / use A-D',550,90,18,'#b9d7ff','center');
 x.fillStyle='#17294b';x.fillRect(170,110,760,430);x.strokeStyle='#42d9ff';x.lineWidth=5;x.strokeRect(170,110,760,430);
 for(let i=0;i<7;i++){x.fillStyle=['#ff5b5b','#ffd84a','#56e66d','#a86cff'][i%4];x.beginPath();x.arc(260+i*95,210+(i%2)*75,22,0,7);x.fill()}
 text('🏓',550,380,80,'#fff','center');text('FLIPPER SCORE: '+score,550,500,28,'#ffd84a','center');
 btn('🖱 FLIP!',410,575,280,70)
}
function flipperBall(){score+=50;coins+=10;gems+=Math.random()<.2?1:0}
function pizza(){
 bg();top('🍕 PIZZA PUZZLE');text('Slice the pizza into the shown number of pieces!',550,95,22,'#fff','center');
 x.fillStyle='#d89542';x.beginPath();x.arc(550,330,170,0,7);x.fill();x.fillStyle='#f6d26b';x.beginPath();x.arc(550,330,150,0,7);x.fill();
 for(let i=0;i<8;i++){let a=i*Math.PI/4;x.strokeStyle='#9b5428';x.lineWidth=4;x.beginPath();x.moveTo(550,330);x.lineTo(550+150*Math.cos(a),330+150*Math.sin(a));x.stroke()}
 text('🍅  🫑  🧀',550,335,48,'#fff','center');text(`Completed slices: ${pizza}/8`,550,455,24,'#ffd84a','center');btn('SLICE! +100 COINS',390,520,320,75)
}
function egyptGame(){
 bg();top('🏺 EGYPTIAN EVENT');text('COLLECT 5 ANKHS TO OPEN THE TEMPLE',550,110,22,'#ffd84a','center');
 text('𓂀',550,290,150,'#e7b84b','center');text(`ANKHS: ${egypt}/5`,550,430,32,'#fff','center');btn('COLLECT ANKH',390,560,320,75)
}
function tycoon(){
 bg();top('🏗 TYCOON CLICKER');text('Build your Chrono empire',550,95,28,'#fff','center');
 const buildings=[['RUN TRACK',120,190,50],['FLIPPER ARENA',340,190,100],['JUMPER TOWER',560,190,180],['DOG PARK',780,190,300]];
 buildings.forEach(([n,bx,by,cost],i)=>{x.fillStyle='#24466f';x.fillRect(bx,by,200,180);text(['🏃','⚡','🦘','🐶'][i],bx+100,by+85,60,'#fff','center');text(n,bx+100,by+125,18,'#fff','center');text('LV '+Math.floor(coins/(cost*5)+1),bx+100,by+155,16,'#ffd84a','center')});
 btn('💰 CLICK TO EARN',390,500,320,90);text(`Income: +${10+Math.floor(gems/5)} coins / click`,550,625,18,'#b9d7ff','center')
}
function over(){bg();text('💥 GAME OVER',550,260,60,'#ff5b5b','center');text(`Score: ${score}   Best: ${best}`,550,325,28,'#fff','center');btn('RESTART',420,400,260,80)}
function loop(now){let dt=Math.min(40,now-last);last=now;t+=dt/16;
 if(mode==='hub')hub();else if(mode==='run')run();else if(mode==='flipper')flipper();else if(mode==='pizza')pizza();else if(mode==='egypt')egyptGame();else if(mode==='tycoon')tycoon();else over();
 requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
